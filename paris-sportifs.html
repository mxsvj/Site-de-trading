    + '<div class="field"><label>Clé API-Football</label><input id="afKey" type="password" placeholder="colle ta clé ici" value="' + esc(CFG.afKey) + '">'
    + '<div class="hint">Le socle : calendrier, résultats, cotes de ~30 bookmakers, buteurs. '
    + 'Compte gratuit sur <a href="https://dashboard.api-football.com/register" target="_blank" rel="noopener">dashboard.api-football.com</a> — '
    + '100 requêtes par jour, sans carte bancaire. Une analyse complète en consomme environ 5.</div></div>'
    + '<div class="field"><label>Clé The Odds API <span style="color:var(--muted-2)">(facultatif)</span></label><input id="oaKey" type="password" placeholder="facultatif" value="' + esc(CFG.oaKey) + '">'
    + '<div class="hint">Ajoute des bookmakers européens supplémentaires pour élargir la comparaison. '
    + 'Compte gratuit sur <a href="https://the-odds-api.com/" target="_blank" rel="noopener">the-odds-api.com</a> — 500 crédits par mois. '
    + 'Une analyse en consomme 4.</div></div>'
    + '</div>'
    + '<div class="grid g2" style="margin-top:14px">'
    + '<div class="field"><label>Utiliser The Odds API</label><select id="useOa">'
    + '<option value="0"' + (!CFG.useOddsApi?' selected':'') + '>Non — économise les crédits</option>'
    + '<option value="1"' + (CFG.useOddsApi?' selected':'') + '>Oui — plus de bookmakers</option></select></div>'
    + '<div class="field"><label>Saison</label><select id="season">'
    + seasons.map(function(s){
        return '<option value="' + s + '"' + (String(CFG.season) === String(s) ? ' selected' : '') + '>' + (s === '' ? 'Automatique' : s + '–' + ((+s)+1)) + '</option>';
      }).join('')
    + '</select><div class="hint">Laisse sur automatique sauf si la compétition n\'a pas encore commencé.</div></div>'
    + '</div></div>'

    + '<div class="panel"><div class="panel-h"><div class="t">Capital et mise</div></div>'
    + '<div class="grid g3">'
    + '<div class="field"><label>Bankroll (€)</label><input id="bankroll" type="number" min="10" step="10" value="' + CFG.bankroll + '"></div>'
    + '<div class="field"><label>Fraction de Kelly</label><select id="kellyDiv">'
    + [1,2,3,4,5,10].map(function(k){ return '<option value="' + k + '"' + (CFG.kellyDiv===k?' selected':'') + '>' + (k===1?'Kelly plein (risqué)':'Kelly / ' + k) + '</option>'; }).join('')
    + '</select><div class="hint">Kelly plein maximise la croissance mais encaisse des chutes brutales. Kelly/4 est le standard prudent.</div></div>'
    + '<div class="field"><label>Mise maximale (% du capital)</label><input id="maxStake" type="number" min="0.1" max="20" step="0.1" value="' + CFG.maxStake + '"></div>'
    + '</div></div>'

    + '<div class="panel"><div class="panel-h"><div class="t">Modèle</div></div>'
    + '<div class="grid g3">'
    + '<div class="field"><label>Poids du modèle : <b id="mwLbl">' + CFG.modelWeight + ' %</b></label>'
    + '<input id="modelWeight" type="range" min="0" max="100" step="5" value="' + CFG.modelWeight + '">'
    + '<div class="hint">0 % = on ne croit que le marché. 100 % = on ne croit que le modèle. '
    + 'Le marché est très efficace : au-delà de 50 % tu trouveras beaucoup de « valeur » qui n\'en est pas.</div></div>'
    + '<div class="field"><label>Écart minimum (%)</label><input id="minEdge" type="number" min="0" max="30" step="0.5" value="' + CFG.minEdge + '">'
    + '<div class="hint">En dessous, on ne signale rien. 3 à 5 % est un seuil sérieux.</div></div>'
    + '<div class="field"><label>Retrait de la marge</label><select id="devig">'
    + '<option value="shin"' + (CFG.devig==='shin'?' selected':'') + '>Shin (recommandé)</option>'
    + '<option value="power"' + (CFG.devig==='power'?' selected':'') + '>Puissance</option>'
    + '<option value="prop"' + (CFG.devig==='prop'?' selected':'') + '>Proportionnelle</option>'
    + '</select><div class="hint">Comment retirer la commission du book pour retrouver sa vraie estimation.</div></div>'
    + '</div>'
    + '<div class="grid g3" style="margin-top:14px">'
    + '<div class="field"><label>Minutes attendues (buteurs)</label><input id="expMinutes" type="number" min="15" max="90" step="5" value="' + CFG.expMinutes + '"></div>'
    + '</div></div>'

    + '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">'
    + '<button class="btn btn-primary" id="save">Enregistrer</button>'
    + '<button class="btn btn-ghost" id="reset">Valeurs par défaut</button>'
    + '<button class="btn btn-ghost" id="wipe">Effacer mes clés</button>'
    + '<span class="status" id="saved" style="align-self:center"></span>'
    + '</div>'
    + footer();

  $('#modelWeight').addEventListener('input', function(){ $('#mwLbl').textContent = this.value + ' %'; });

  $('#save').addEventListener('click', function(){
    CFG.afKey = $('#afKey').value.trim();
    CFG.oaKey = $('#oaKey').value.trim();
    CFG.useOddsApi = $('#useOa').value === '1';
    CFG.season = $('#season').value ? +$('#season').value : 0;
    CFG.bankroll = Math.max(10, +$('#bankroll').value || 500);
    CFG.kellyDiv = +$('#kellyDiv').value || 4;
    CFG.maxStake = clamp(+$('#maxStake').value || 2, .1, 20);
    CFG.modelWeight = clamp(+$('#modelWeight').value, 0, 100);
    CFG.minEdge = clamp(+$('#minEdge').value, 0, 30);
    CFG.devig = $('#devig').value;
    CFG.expMinutes = clamp(+$('#expMinutes').value || 75, 15, 90);
    if(CFG.afKey) CFG.demo = false;
    saveCfg(); paintQuota();
    $('#saved').textContent = 'Enregistré ✓' + (CFG.afKey ? ' — les données réelles sont actives.' : '');
    ANALYSES = [];
  });

  $('#reset').addEventListener('click', function(){
    var keys = { afKey:CFG.afKey, oaKey:CFG.oaKey };
    CFG = Object.assign({}, DEFAULTS, keys);
    saveCfg(); renderSettings(); $('#saved').textContent = 'Réglages remis à zéro (clés conservées).';
  });
  $('#wipe').addEventListener('click', function(){
    CFG.afKey = ''; CFG.oaKey = ''; CFG.demo = true;
    saveCfg(); Cache.clear(); renderSettings(); paintQuota();
    $('#saved').textContent = 'Clés effacées. Retour au mode démo.';
  });
}

/* ------------------------------------------------------------------ Aide */
function renderHelp(){
  $('#app').innerHTML = ''
    + '<div class="eyebrow">Comment ça marche</div>'
    + '<h1 class="title">Ce que l\'outil calcule,<br>et ce qu\'il ne peut pas savoir.</h1>'

    + '<div class="callout"><b>En une phrase</b>On estime la probabilité de chaque issue à partir des résultats récents, '
    + 'on la compare à la meilleure cote du marché, et on ne signale que les cas où la cote est mathématiquement trop généreuse.</div>'

    + '<h2 class="sec">1 · Comparer tous les bookmakers</h2>'
    + '<p class="lede">Une cote de 2,00 correspond à 50 % de chances — mais le bookmaker gonfle toujours un peu. '
    + 'La somme des probabilités implicites d\'un 1X2 dépasse 100 % : ce surplus est sa <b>marge</b>, entre 2 % chez les plus serrés '
    + 'et 10 % chez les plus gourmands. On la retire (méthode de Shin) pour retrouver ce que le book pense vraiment, '
    + 'puis on fait la moyenne de tous les bookmakers en donnant plus de poids aux plus fiables. '
    + 'C\'est le <b>consensus du marché</b>, et c\'est une estimation redoutablement bonne.</p>'
    + '<p class="lede">En parallèle on garde la <b>meilleure cote</b> pour chaque issue. Si les meilleures cotes de trois books différents '
    + 'couvrent toutes les issues pour moins de 100 %, il y a <b>surebet</b> : le gain est garanti quel que soit le résultat.</p>'

    + '<h2 class="sec">2 · Analyser la forme</h2>'
    + '<p class="lede">Pour chaque équipe on calcule une force offensive et une force défensive, séparément à domicile et à l\'extérieur, '
    + 'à partir de tous ses matchs de la saison — les récents comptant davantage (chaque match plus ancien pèse 7 % de moins). '
    + 'Les petites séries sont ramenées vers la moyenne du championnat pour éviter de surréagir à trois matchs.</p>'
    + '<p class="lede">Ces forces donnent le nombre de buts attendus de chaque côté, transformé en probabilité de chaque score exact '
    + 'par une loi de Poisson corrigée (Dixon-Coles, qui rattrape la sous-estimation des 0-0 et 1-1). '
    + 'De cette grille de scores on tire le 1X2, les plus/moins de buts, et « les deux équipes marquent ». '
    + 'Pour les joueurs, la cadence de buts par 90 minutes est ajustée par ce que son équipe est censée marquer <i>dans ce match précis</i>.</p>'

    + '<h2 class="sec">3 · Croiser les deux</h2>'
    + '<p class="lede">Le modèle seul se trompe souvent : il ignore les blessures, les compositions, la météo, le contexte. '
    + 'Le marché intègre tout ça. On mélange donc les deux (35 % modèle par défaut) et on compare le résultat à la meilleure cote. '
    + 'Si <code style="font-family:var(--mono);font-size:13px;color:var(--gold-bright)">probabilité × cote &gt; 1</code>, il y a de la valeur. '
    + 'La mise est calculée par le critère de Kelly, divisé par 4 pour amortir la variance.</p>'

    + '<h2 class="sec">Ce que l\'outil ne sait pas</h2>'
    + '<ul style="margin:0 0 16px 2px;list-style:none;display:flex;flex-direction:column;gap:9px;color:#C2C6D0;font-size:15px">'
    + ['Les <b>blessures et suspensions</b> : un buteur absent change tout, le modèle ne le voit pas.',
       'Les <b>compositions</b>, annoncées une heure avant : une équipe qui fait tourner avant une coupe d\'Europe.',
       'Le <b>contexte</b> : un match sans enjeu de fin de saison, un derby, un entraîneur limogé la veille.',
       'La <b>qualité réelle des occasions</b> : sans données xG, une équipe chanceuse paraît meilleure qu\'elle ne l\'est.',
       'Les <b>limites de mise</b> : un book qui repère un joueur gagnant lui ferme le robinet.'
      ].map(function(t){ return '<li style="position:relative;padding-left:22px"><span style="position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;background:var(--gold);transform:rotate(45deg)"></span>' + t + '</li>'; }).join('')
    + '</ul>'
    + '<p class="lede">Un écart signalé n\'est donc jamais une certitude : c\'est une hypothèse chiffrée. '
    + 'Quand le modèle et le marché divergent beaucoup, c\'est souvent le marché qui a raison — il sait quelque chose que le modèle ignore. '
    + 'Le seul cas sans incertitude est le surebet, et il exige de miser vite chez plusieurs books à la fois.</p>'

    + '<h2 class="sec">Rester gratuit</h2>'
    + '<p class="lede">L\'outil est conçu pour ne jamais coûter un centime. Au lieu d\'appeler une API par match, il télécharge '
    + '<b>une compétition entière en environ 5 requêtes</b> — calendrier complet, buteurs, cotes de tous les bookmakers — '
    + 'puis analyse les 10 à 12 matchs à venir en local, simultanément. Avec les 100 requêtes quotidiennes gratuites d\'API-Football, '
    + 'cela fait une vingtaine d\'analyses complètes par jour. Les réponses sont mises en cache dans ton navigateur '
    + '(calendrier 8 h, buteurs 24 h, cotes 15 min) : relancer une analyse ne consomme rien. '
    + 'Un compteur en haut à droite montre en permanence ce qu\'il te reste, et l\'outil refuse de dépasser le palier gratuit.</p>'
    + footer();
}

/* ------------------------------------------------------------------ Boot */
(function boot(){
  if(CFG.demo == null) CFG.demo = !CFG.afKey;
  paintQuota();
  go('scan');
})();
</script>
</body>
</html>
