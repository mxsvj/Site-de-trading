            }).join('')
          + '<td class="marge">' + pct(r.margin,1) + '</td></tr>';
      }).join('')
    + '</tbody><tfoot><tr><td>Marge moyenne</td><td colspan="' + m.labels.length + '"></td><td>' + pct(m.avgMargin,1) + '</td></tr></tfoot></table></div>'
    + '<div class="srcline">★ = bookmaker « sharp » (marge faible, cotes de référence) — il pèse plus lourd dans le consensus. '
    + 'La marge est ce que le book prélève : plus elle est basse, plus la cote est honnête.'
    + (m.otherLines ? ' ' + m.otherLines + ' autre' + (m.otherLines>1?'s lignes ont':' ligne a') + ' été écartée' + (m.otherLines>1?'s':'')
        + ' : on ne peut comparer que des cotes portant sur la même ligne.' : '')
    + '</div></details>';

  return '<div class="panel">'
    + '<div class="panel-h"><div class="t">' + esc(marketLabel(m.key, sp, m.line)) + '</div>'
    + '<div class="s">' + m.nBooks + ' bookmakers · marge de ' + pct(m.bestMargin,1) + ' à ' + pct(m.rows[m.rows.length-1].margin,1) + '</div></div>'
    + arbBox + summary + full + '</div>';
}

function formCol(title, f, model, side, sp){
  if(!f) return '<div class="panel"><div class="panel-h"><div class="t">' + esc(title) + '</div></div><div class="empty">Pas d\'historique.</div></div>';
  var chips = f.last.slice().reverse().map(function(m){
    return '<span class="chip ' + m.res + '" title="' + esc(m.res==='W'?'Victoire':(m.res==='N'?'Nul':'Défaite')) + ' ' + m.gf + '-' + m.ga + ' contre ' + esc(m.opp) + (m.home?' (dom.)':' (ext.)') + '">' + m.res + '</span>';
  }).join('');
  var goals = sp.kind === 'goals';
  var line = function(l, v){ return '<div class="statline"><span>' + l + '</span><b>' + v + '</b></div>'; };

  return '<div class="panel"><div class="panel-h"><div class="t">' + esc(title) + '</div>'
    + '<div class="form">' + chips + '</div></div>'
    + '<div class="teamcol">'
    + (goals ? line('Points sur 5 matchs', f.pts + ' / ' + f.max)
             : line('Victoires sur 5 matchs', f.wins + ' / ' + f.last.length))
    + line((goals ? 'Buts' : 'Points') + ' marqués / encaissés (5)', f.gf + ' – ' + f.ga)
    + line('Moyenne sur la saison', goals ? f.gfAvg.toFixed(2) + ' – ' + f.gaAvg.toFixed(2)
                                          : Math.round(f.gfAvg) + ' – ' + Math.round(f.gaAvg))
    + (goals ? line('Clean sheets (5)', f.cleanSheets) + line('A marqué dans', f.scored + ' / ' + f.last.length)
             : line('Écart moyen', (f.gfAvg - f.gaAvg > 0 ? '+' : '') + (f.gfAvg - f.gaAvg).toFixed(1)))
    + (f.rest != null ? line('Jours de repos', f.rest) : '')
    + (model ? line('Force offensive ' + (side==='home'?'à domicile':'à l\'extérieur'),
                    '×' + (side==='home'?model.strengths.attH:model.strengths.attA).toFixed(2))
             + line('Solidité défensive',
                    '×' + (side==='home'?model.strengths.defH:model.strengths.defA).toFixed(2)) : '')
    + line('Matchs dans l\'échantillon', f.played)
    + '</div></div>';
}

function scorerBlock(title, list, lam){
  if(!list || !list.length) return '';
  return '<div class="panel"><div class="panel-h"><div class="t">' + esc(title) + '</div>'
    + '<div class="s">' + lam.toFixed(2) + ' buts attendus pour l\'équipe</div></div>'
    + '<div class="plist">'
    + list.map(function(p){
        return '<div class="prow"><div class="nm">' + esc(p.name)
          + ' <i>' + p.goals + ' buts · ' + p.per90.toFixed(2) + '/90' + (p.penalties ? ' · ' + p.penalties + ' pén.' : '') + '</i></div>'
          + '<div class="p">' + pct(p.prob,1) + '</div><div class="c">' + od(p.fair) + '</div></div>';
      }).join('')
    + '</div><div class="srcline">Probabilité de marquer au moins un but sur ' + CFG.expMinutes + ' minutes jouées, et cote juste correspondante. '
    + 'Compare-la à la cote « buteur » de ton book : au-dessus, c\'est de la valeur.</div></div>';
}

/* Le panneau du modèle n'a pas la même forme selon le sport */
function modelPanel(a){
  var m = a.match, mk = a.markets;
  var mktP = function(key, i){ return mk[key] ? mk[key].picks[i].pMarket : null; };

  if(!a.model){
    return SPORTS[a.sport].kind === 'none'
      ? '<div class="callout"><b>Pas de modèle en tennis</b>Aucune source gratuite ne donne la forme, la surface, les confrontations '
        + 'directes ou l\'état physique des joueurs. Plutôt que d\'inventer des probabilités, l\'outil s\'en tient à ce qu\'il sait vraiment : '
        + 'ce que les bookmakers pensent, une fois leur marge retirée, et là où ils se contredisent.</div>'
      : '<div class="callout warn"><b>Modèle indisponible</b>Pas assez d\'historique pour ces deux équipes. '
        + 'L\'analyse repose uniquement sur la comparaison des bookmakers entre eux.</div>';
  }

  if(a.model.kind === 'goals'){
    var g = a.model.m;
    return '<h2 class="sec">Ce que dit le modèle</h2>'
      + '<div class="panel"><div class="panel-h"><div class="t">Probabilités</div>'
      + '<div class="s">' + a.model.lh.toFixed(2) + ' – ' + a.model.la.toFixed(2) + ' buts attendus · ' + sampleLabel(a.model) + '</div></div>'
      + '<div class="pbars">'
      + bar('Victoire ' + m.home, g.home, mktP('1x2',0))
      + bar('Match nul', g.draw, mktP('1x2',1))
      + bar('Victoire ' + m.away, g.away, mktP('1x2',2))
      + (mk.ou ? bar('Plus de ' + fmtNum(mk.ou.line) + ' buts', overLine(a.model.matrix, mk.ou.line), mktP('ou',0), true)
               : bar('Plus de 2,5 buts', g.over25, null, true))
      + bar('Les deux marquent', g.btts, mktP('btts',0), true)
      + '</div>'
      + '<div class="srcline">Barre pleine = modèle · trait vert = consensus des bookmakers après retrait de leur marge.</div>'
      + '<h3 class="sub">Scores les plus probables</h3>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + g.scores.map(function(s){ return '<span class="badge" style="font-size:11px">' + s.s + ' · ' + pct(s.p,1) + '</span>'; }).join('')
      + '</div></div>';
  }

  var mo = a.model;
  return '<h2 class="sec">Ce que dit le modèle</h2>'
    + '<div class="panel"><div class="panel-h"><div class="t">Probabilités</div>'
    + '<div class="s">' + Math.round(mo.lh) + ' – ' + Math.round(mo.la) + ' points attendus · ' + sampleLabel(mo) + '</div></div>'
    + '<div class="pbars">'
    + bar('Victoire ' + m.home, mo.m.home, mktP('ml',0))
    + bar('Victoire ' + m.away, mo.m.away, mktP('ml',1))
    + (mk.ou ? bar('Plus de ' + fmtNum(mk.ou.line) + ' points', modelFor('ou', mo, mk.ou.line)[0], mktP('ou',0), true) : '')
    + (mk.ah ? bar(m.home + ' ' + signed(mk.ah.line), modelFor('ah', mo, mk.ah.line)[0], mktP('ah',0), true) : '')
    + '</div>'
    + '<div class="srcline">Barre pleine = modèle · trait vert = consensus des bookmakers après retrait de leur marge.</div>'
    + '<div class="kpis">'
    + '<div class="kpi"><div class="k">Écart attendu</div><div class="v">' + (mo.margin>0?'+':'') + mo.margin.toFixed(1) + '</div></div>'
    + '<div class="kpi"><div class="k">Total attendu</div><div class="v">' + mo.total.toFixed(1) + '</div></div>'
    + '<div class="kpi"><div class="k">Écart-type</div><div class="v">' + mo.sig.toFixed(1) + '</div></div>'
    + '</div>'
    + '<div class="srcline">L\'écart-type est mesuré sur les matchs déjà joués : il dit de combien un résultat s\'écarte '
    + 'typiquement de la prévision. Plus il est grand, moins un favori est sûr.</div></div>';
}

function renderMatch(i){
  var a = ANALYSES[i];
  if(!a){ go('scan'); return; }
  var v = a.verdict, m = a.match, sp = SPORTS[a.sport];

  var vHtml;
  if(v.type === 'arb'){
    var p = v.data.picks;
    var nb = p.map(function(x){ return x.book; }).filter(function(x,k,arr){ return arr.indexOf(x) === k; }).length;
    vHtml = '<div class="verdict go"><div class="verdict-h"><span class="badge arb">Surebet</span>'
      + '<span class="pick">Gain garanti de ' + pct(v.roi,2) + '</span></div>'
      + '<div class="why">Les meilleures cotes de ' + (nb > 1 ? nb + ' bookmakers différents couvrent' : 'ce bookmaker couvrent')
      + ' toutes les issues pour moins de 100 % : '
      + p.map(function(x){ return '<b>' + esc(x.name) + '</b> à ' + od(x.odd) + ' chez ' + esc(x.book); }).join(', ')
      + '. Le résultat du match n\'a plus d\'importance.</div></div>';
  } else if(v.type === 'value'){
    var d = v.data;
    vHtml = '<div class="verdict val"><div class="verdict-h"><span class="badge value">Value bet</span>'
      + '<span class="pick">' + esc(d.name) + ' à ' + od(d.odd) + '</span>'
      + '<span class="badge">' + esc(marketLabel(v.market, sp, a.markets[v.market].line)) + '</span>'
      + (d.edge > .15 ? '<span class="badge warn">À vérifier</span>' : '') + '</div>'
      + '<div class="why">Notre estimation donne <b>' + pct(d.p,1) + '</b> de chances à cette issue, soit une cote juste de <b>' + od(d.fairOdd) + '</b>. '
      + esc(d.book) + ' l\'affiche à <b>' + od(d.odd) + '</b> : l\'écart en ta faveur est de <b>' + pct(d.edge,1) + '</b> par euro misé.'
      + (!a.model ? ' Ici l\'estimation ne vient que du désaccord entre bookmakers, sans modèle : à prendre avec d\'autant plus de prudence.' : '')
      + (d.spread > .02 ? ' Attention, les bookmakers sont peu d\'accord entre eux sur cette issue (dispersion ' + pct(d.spread,1) + ') — l\'écart peut venir d\'une information que le modèle n\'a pas.' : '')
      + (d.edge > .15 ? ' <b>Un écart de cette taille est suspect</b> : sur un marché liquide il vient presque toujours d\'une cote périmée, d\'une blessure connue de tous sauf du modèle, ou d\'une ligne mal lue. Vérifie la cote chez le bookmaker avant de miser.' : '')
      + '</div>'
      + '<div class="kpis">'
      + '<div class="kpi"><div class="k">Écart</div><div class="v pos">+' + pct(d.edge,1) + '</div></div>'
      + '<div class="kpi"><div class="k">Cote juste</div><div class="v">' + od(d.fairOdd) + '</div></div>'
      + '<div class="kpi"><div class="k">Kelly / ' + CFG.kellyDiv + '</div><div class="v">' + pct(d.kelly/CFG.kellyDiv,1) + '</div></div>'
      + '<div class="kpi"><div class="k">Mise</div><div class="v">' + eur(d.stake) + '</div></div>'
      + '<div class="kpi"><div class="k">Gain net si ✓</div><div class="v pos">' + eur(d.stake*(d.odd-1)) + '</div></div>'
      + '</div></div>';
  } else {
    vHtml = '<div class="verdict"><div class="verdict-h"><span class="badge pass">Rien à jouer</span>'
      + '<span class="pick">Le marché est correct</span></div>'
      + '<div class="why">La meilleure issue ne dégage que <b>' + pct(v.edge,1) + '</b> d\'écart, sous ton seuil de ' + CFG.minEdge + ' %. '
      + 'C\'est le cas le plus fréquent, et c\'est normal : les bookmakers ont raison la plupart du temps. '
      + 'Ne pas parier est ici la décision qui préserve ton capital.</div></div>';
  }

  var mk = Object.keys(a.markets).map(function(k){ return marketBlock(a.markets[k], a); }).join('');

  $('#app').innerHTML = ''
    + '<button class="backlink" id="back">← Retour aux opportunités</button>'
    + '<div class="eyebrow">' + dtf(m.date) + '</div>'
    + '<h1 class="title">' + esc(m.home) + ' <span style="color:var(--muted-2);font-family:var(--mono);font-size:.6em">vs</span> ' + esc(m.away) + '</h1>'
    + vHtml
    + modelPanel(a)
    + '<h2 class="sec">Les bookmakers, marché par marché</h2>'
    + (mk || '<div class="empty">Aucune cote publiée pour ce match.</div>')
    + (a.form.home || a.form.away
      ? '<h2 class="sec">Forme récente</h2><div class="grid g2">'
        + formCol(m.home + ' — domicile', a.form.home, a.model, 'home', sp)
        + formCol(m.away + ' — extérieur', a.form.away, a.model, 'away', sp)
        + '</div>'
      : '')
    + ((a.scorers.home.length || a.scorers.away.length)
      ? '<h2 class="sec">Buteurs probables</h2><div class="grid g2">'
        + scorerBlock(m.home, a.scorers.home, a.model ? a.model.lh : 0)
        + scorerBlock(m.away, a.scorers.away, a.model ? a.model.la : 0)
        + '</div>'
      : '')
    + footer();

  $('#back').addEventListener('click', function(){ go('scan'); });
}


/* -------------------------------------------------------------- Réglages */
function seasonOptions(){
  var sp = sport(), comp = currentComp(), cur = autoSeason(sp, comp);
  var list = [''];
  if(typeof cur === 'number'){ list.push(cur, cur-1, cur-2); }
  else {
    var y = parseInt(String(cur), 10);
    list.push(y + '-' + (y+1), (y-1) + '-' + y, (y-2) + '-' + (y-1));
  }
  return list.map(function(s){
    return '<option value="' + esc(String(s)) + '"' + (String(CFG.season || '') === String(s) ? ' selected' : '') + '>'
      + (s === '' ? 'Automatique (' + cur + ')' : esc(String(s))) + '</option>';
  }).join('');
}

/* ------------------------------------------------------------------ Aide */
function renderHelp(){
  $('#app').innerHTML = ''
    + '<div class="eyebrow">Comment ça marche</div>'
    + '<h1 class="title">Ce que l\'outil calcule,<br>et ce qu\'il ne peut pas savoir.</h1>'

    + '<div class="callout"><b>En une phrase</b>On estime la probabilité de chaque issue, on la compare à la meilleure cote du marché, '
    + 'et on ne signale que les cas où la cote est mathématiquement trop généreuse.</div>'

    + '<h2 class="sec">1 · Comparer tous les bookmakers</h2>'
    + '<p class="lede">Une cote de 2,00 correspond à 50 % de chances — mais le bookmaker gonfle toujours un peu. '
    + 'La somme des probabilités implicites dépasse 100 % : ce surplus est sa <b>marge</b>, entre 2 % chez les plus serrés '
    + 'et 10 % chez les plus gourmands. On la retire (méthode de Shin) pour retrouver ce que le book pense vraiment, '
    + 'puis on fait la moyenne de tous les bookmakers en donnant plus de poids aux plus fiables. '
    + 'C\'est le <b>consensus du marché</b>, et c\'est une estimation redoutablement bonne.</p>'
    + '<p class="lede">En parallèle on garde la <b>meilleure cote</b> pour chaque issue. Si les meilleures cotes de plusieurs books '
    + 'couvrent toutes les issues pour moins de 100 %, il y a <b>surebet</b> : le gain est garanti quel que soit le résultat. '
    + 'Cette partie-là ne dépend d\'aucun modèle — elle marche donc pour les trois sports.</p>'
    + '<p class="lede">Au basket, les bookmakers ne proposent pas tous la même ligne : 224,5 chez l\'un, 225,5 chez l\'autre. '
    + 'Comparer des cotes portant sur des lignes différentes n\'a aucun sens, alors l\'outil retient la ligne que le plus de '
    + 'bookmakers proposent et écarte les autres — en le disant.</p>'

    + '<h2 class="sec">2 · Le modèle, sport par sport</h2>'
    + '<h3 class="sub">Football — loi de Poisson corrigée</h3>'
    + '<p class="lede">Les buts sont rares et se comptent un par un. On calcule pour chaque équipe une force offensive et une force '
    + 'défensive, séparément à domicile et à l\'extérieur, à partir de tous ses matchs de la saison — les récents comptant davantage '
    + '(chaque match plus ancien pèse 7 % de moins). Ces forces donnent les buts attendus de chaque côté, transformés en probabilité '
    + 'de chaque score exact par une loi de Poisson corrigée Dixon-Coles, qui rattrape la sous-estimation des 0-0 et 1-1. '
    + 'De cette grille on tire le 1X2, les plus/moins de buts et « les deux marquent ». '
    + 'Pour les joueurs, la cadence de buts par 90 minutes est ajustée par ce que son équipe est censée marquer <i>dans ce match précis</i>.</p>'

    + '<h3 class="sub">Basket — loi normale sur l\'écart</h3>'
    + '<p class="lede">Cent points par équipe et par match : compter score par score n\'a plus de sens, la loi normale est le bon outil. '
    + 'Les forces offensive et défensive se calculent de la même façon qu\'au football, mais en points. On en tire l\'écart attendu et '
    + 'le total attendu, puis on lit la probabilité de victoire, de couverture du handicap et de dépassement du total sur une courbe '
    + 'en cloche. <b>L\'écart-type n\'est pas posé à la main</b> : il est mesuré sur les matchs déjà joués, en comparant chaque résultat '
    + 'réel à celui qu\'on aurait prédit. C\'est lui qui dit à quel point un favori est vraiment sûr.</p>'
    + '<p class="lede">Il n\'y a pas de statistiques joueur au basket : l\'API ne les fournit pas sur son palier gratuit, et aller les '
    + 'chercher équipe par équipe brûlerait le quota en quelques matchs. Plutôt qu\'un modèle joueur bricolé, il n\'y en a pas.</p>'

    + '<h3 class="sub">Tennis — aucun modèle, et c\'est assumé</h3>'
    + '<p class="lede">Aucune API de statistiques tennis n\'a de palier gratuit : ni classement, ni forme, ni surface, ni confrontations '
    + 'directes, ni état physique. Inventer un modèle sans ces données produirait des probabilités qui ont l\'air sérieuses et ne le sont pas. '
    + 'L\'outil s\'en tient donc à ce qu\'il sait vraiment : ce que pensent les bookmakers une fois leur marge retirée, et là où ils se '
    + 'contredisent. C\'est plus mince — mais les écarts entre books sont justement plus larges en tennis que dans les grands championnats, '
    + 'donc les surebets y sont plus fréquents.</p>'

    + '<h2 class="sec">3 · Croiser les deux</h2>'
    + '<p class="lede">Le modèle seul se trompe souvent : il ignore les blessures, les compositions, le contexte. Le marché intègre tout ça. '
    + 'On mélange donc les deux (20 % modèle par défaut) et on compare le résultat à la meilleure cote. '
    + 'Si <code style="font-family:var(--mono);font-size:13px;color:var(--gold-bright)">probabilité × cote &gt; 1</code>, il y a de la valeur. '
    + 'La mise est calculée par le critère de Kelly, divisé par 4 pour amortir la variance. En tennis, faute de modèle, '
    + 'seule la comparaison entre bookmakers joue.</p>'
    + '<p class="lede">Pourquoi seulement 20 % ? Parce qu\'un modèle nourri par une seule saison est bruité : '
    + 'avec une trentaine de matchs par équipe, ses probabilités portent <b>environ 6 points de pourcentage</b> d\'erreur '
    + 'd\'estimation. Le marché, lui, en porte 2 à 3. Pondérer chaque estimation par l\'inverse de son erreur donne 20 % au modèle — '
    + 'et explique pourquoi le seuil d\'écart minimum est à 4 % : en dessous, on lirait le bruit du modèle pour de la valeur.</p>'

    + '<h2 class="sec">Ce que l\'outil ne sait pas</h2>'
    + '<ul style="margin:0 0 16px 2px;list-style:none;display:flex;flex-direction:column;gap:9px;color:#C2C6D0;font-size:15px">'
    + ['Les <b>blessures et suspensions</b> : un buteur ou un intérieur absent change tout, le modèle ne le voit pas.',
       'Les <b>compositions</b> et le <b>temps de jeu</b> : une équipe qui fait tourner avant un match important.',
       'Le <b>contexte</b> : un match sans enjeu de fin de saison, un derby, un entraîneur limogé la veille, un back-to-back en NBA.',
       'La <b>qualité réelle des occasions</b> : sans données avancées, une équipe chanceuse paraît meilleure qu\'elle ne l\'est.',
       'Les <b>limites de mise</b> : un book qui repère un joueur gagnant lui ferme le robinet.'
      ].map(function(t){ return '<li style="position:relative;padding-left:22px"><span style="position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;background:var(--gold);transform:rotate(45deg)"></span>' + t + '</li>'; }).join('')
    + '</ul>'
    + '<p class="lede">Un écart signalé n\'est donc jamais une certitude : c\'est une hypothèse chiffrée. '
    + 'Quand le modèle et le marché divergent beaucoup, c\'est souvent le marché qui a raison — il sait quelque chose que le modèle ignore. '
    + 'Le seul cas sans incertitude est le surebet, et il exige de miser vite chez plusieurs books à la fois.</p>'

    + '<h2 class="sec">Rester gratuit</h2>'
    + '<p class="lede">L\'outil est conçu pour ne jamais coûter un centime. Au lieu d\'appeler une API par match, il télécharge '
    + '<b>une compétition entière en environ 5 requêtes</b> — calendrier complet, marqueurs, cotes de tous les bookmakers — '
    + 'puis analyse les 10 à 12 matchs à venir en local, simultanément. Avec les 100 requêtes quotidiennes gratuites d\'API-Sports, '
    + 'cela fait une vingtaine d\'analyses complètes par jour. Les réponses sont mises en cache dans ton navigateur '
    + '(calendrier 8 h, marqueurs 24 h, cotes 15 min, liste des compétitions 30 jours) : relancer une analyse ne consomme rien. '
    + 'Un compteur en haut à droite montre en permanence ce qu\'il te reste, et l\'outil refuse de dépasser le palier gratuit.</p>'
    + '<p class="lede">Le tennis passe par The Odds API, dont la liste des tournois est gratuite et illimitée ; '
    + 'seules les cotes coûtent 2 crédits sur les 500 mensuels.</p>'
    + footer();
}
