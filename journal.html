<!DOCTYPE html>
<html lang="fr" style="scrollbar-gutter:stable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal de trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- Thème ----------
     Sombre par défaut (bleu nuit, accent violet électrique + cyan).
     Le thème clair suit le système, ou le choix fait avec le bouton. */
  :root{
    --bg:#070A14;
    --bg-2:#0B1020;
    --panel:#0F1528;
    --panel-2:#151C34;
    --field:#0A0F1E;
    --line:#1F2945;
    --line-2:#2A3558;
    --text:#E8ECF8;
    --text-2:#B7BFD6;
    --muted:#8A93B0;
    --muted-2:#5B6485;
    --accent:#7C5CFF;
    --accent-rgb:124,92,255;
    --accent-2:#22D3EE;
    --accent-2-rgb:34,211,238;
    --gold:var(--accent);
    --gold-bright:#A996FF;
    --good:#2EE59D;
    --good-rgb:46,229,157;
    --bad:#FF5C7A;
    --bad-rgb:255,92,122;
    --warn:#FFC857;
    --warn-rgb:255,200,87;
    --on-accent:#FFFFFF;
    --glow:0 0 0 1px rgba(var(--accent-rgb),.25),0 18px 50px -20px rgba(var(--accent-rgb),.55);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 40px -28px rgba(0,0,0,.8);
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F5F6FB;--bg-2:#ECEEF7;--panel:#FFFFFF;--panel-2:#F2F3FA;--field:#F7F8FC;
      --line:#E1E4F0;--line-2:#CDD2E4;--text:#12162B;--text-2:#3A4163;--muted:#666E8F;--muted-2:#9097B3;
      --accent:#5B3DF5;--accent-rgb:91,61,245;--accent-2:#0891B2;--accent-2-rgb:8,145,178;--gold-bright:#5B3DF5;
      --good:#0E9F6E;--good-rgb:14,159,110;--bad:#E11D48;--bad-rgb:225,29,72;--warn:#B45309;--warn-rgb:180,83,9;
      --glow:0 0 0 1px rgba(var(--accent-rgb),.2),0 14px 34px -18px rgba(var(--accent-rgb),.45);
      --shadow:0 1px 2px rgba(18,22,43,.05),0 12px 30px -22px rgba(18,22,43,.25);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F6FB;--bg-2:#ECEEF7;--panel:#FFFFFF;--panel-2:#F2F3FA;--field:#F7F8FC;
    --line:#E1E4F0;--line-2:#CDD2E4;--text:#12162B;--text-2:#3A4163;--muted:#666E8F;--muted-2:#9097B3;
    --accent:#5B3DF5;--accent-rgb:91,61,245;--accent-2:#0891B2;--accent-2-rgb:8,145,178;--gold-bright:#5B3DF5;
    --good:#0E9F6E;--good-rgb:14,159,110;--bad:#E11D48;--bad-rgb:225,29,72;--warn:#B45309;--warn-rgb:180,83,9;
    --glow:0 0 0 1px rgba(var(--accent-rgb),.2),0 14px 34px -18px rgba(var(--accent-rgb),.45);
    --shadow:0 1px 2px rgba(18,22,43,.05),0 12px 30px -22px rgba(18,22,43,.25);
    color-scheme:light;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.6;font-size:15px;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"cv11","ss01";
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(800px 480px at 100% -10%, rgba(var(--accent-rgb),.16), transparent 60%),
      radial-gradient(700px 520px at 20% 110%, rgba(var(--accent-2-rgb),.08), transparent 60%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse 70% 50% at 70% 0%,#000 0%,transparent 70%);
            mask-image:radial-gradient(ellipse 70% 50% at 70% 0%,#000 0%,transparent 70%);
  }
  ::selection{background:rgba(var(--accent-rgb),.35)}
  a{color:var(--accent-2)}

  /* ---------- Chrome : barre latérale ---------- */
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
  .topbar{
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;
    padding:26px 18px;border-right:1px solid var(--line);
    background:color-mix(in srgb,var(--bg-2) 82%,transparent);backdrop-filter:blur(16px);
  }
  .brand{display:flex;align-items:center;gap:12px;padding:0 8px}
  .brand .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--glow)}
  .brand .logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .brand .w1{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.4px;line-height:1.1;display:block}
  .brand .w2{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);display:block}
  .tabs{display:flex;flex-direction:column;gap:4px}
  .tab{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);
    background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;transition:.18s;
  }
  .tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .tab:hover{color:var(--text);background:var(--panel)}
  .tab.active{color:var(--text);background:var(--panel-2);border-color:var(--line-2);box-shadow:inset 3px 0 0 var(--accent)}
  .tab.active svg{stroke:var(--accent)}
  .tab.cta{margin-top:6px;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));box-shadow:var(--glow);justify-content:center;font-weight:600}
  .tab.cta svg{stroke:var(--on-accent)}
  .tab.cta.active{box-shadow:var(--glow),inset 0 0 0 2px rgba(255,255,255,.35)}
  .tab:focus-visible,.themebtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
  .themebtn{display:flex;align-items:center;gap:10px;font-family:var(--body);font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
  .themebtn:hover{color:var(--text);border-color:var(--line-2)}
  .themebtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
  .sidefoot .priv{font-size:11.5px;color:var(--muted-2);line-height:1.5;padding:0 4px}

  .wrap{max-width:1160px;width:100%;margin:0 auto;padding:44px 40px 110px;position:relative;z-index:1}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:1.6px;text-transform:uppercase;color:var(--accent-2);margin-bottom:14px;
    padding:5px 10px;border-radius:999px;background:rgba(var(--accent-2-rgb),.1);border:1px solid rgba(var(--accent-2-rgb),.25);
  }
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2)}
  h1.title{font-family:var(--display);font-size:clamp(26px,3.4vw,38px);font-weight:700;line-height:1.1;letter-spacing:-1.2px;margin-bottom:14px}
  h2.sec{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.5px;margin:38px 0 14px}
  p.lede{font-size:17px;color:var(--text-2);max-width:720px;margin-bottom:20px}
  .callout{
    border:1px solid rgba(var(--accent-rgb),.3);border-radius:14px;
    background:linear-gradient(135deg,rgba(var(--accent-rgb),.1),rgba(var(--accent-rgb),.02));
    padding:15px 18px;margin:18px 0;font-size:14px;color:var(--text-2);
  }
  .callout b{color:var(--text);font-weight:600}
  .callout > b:first-child{color:var(--accent);display:block;font-family:var(--mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:4px}
  .callout.warn{border-color:rgba(var(--warn-rgb),.35);background:linear-gradient(135deg,rgba(var(--warn-rgb),.1),rgba(var(--warn-rgb),.02))}
  .callout.warn > b:first-child{color:var(--warn)}

  .btn{
    font-family:var(--body);font-size:14px;font-weight:600;padding:12px 22px;border-radius:12px;
    cursor:pointer;border:1px solid transparent;transition:transform .12s,box-shadow .2s,opacity .2s,background .2s,border-color .2s;
    color:var(--text);
  }
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));color:var(--on-accent);box-shadow:var(--glow)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn-ghost{background:var(--panel-2);color:var(--text);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--line-2);background:var(--panel)}
  .btn-danger{background:rgba(var(--bad-rgb),.1);color:var(--bad);border-color:rgba(var(--bad-rgb),.35)}
  .btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font-size:12px;font-weight:500;color:var(--muted)}
  .field .hint{font-size:11.5px;color:var(--muted-2);line-height:1.45}
  .field input,.field select,.field textarea{
    background:var(--field);border:1px solid var(--line);border-radius:11px;color:var(--text);
    font-family:var(--body);font-size:14.5px;padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%;
  }
  .field textarea{min-height:92px;resize:vertical;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)}
  .field input.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(var(--bad-rgb),.15)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .span2{grid-column:span 2}
  .span4{grid-column:1/-1}

  .seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{font-family:var(--body);font-size:13.5px;font-weight:600;border:0;border-radius:8px;padding:8px 16px;background:none;color:var(--muted);cursor:pointer;transition:.15s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--panel-2);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
  .seg button.on.long{background:rgba(var(--good-rgb),.15);color:var(--good);box-shadow:0 0 0 1px rgba(var(--good-rgb),.35)}
  .seg button.on.short{background:rgba(var(--bad-rgb),.15);color:var(--bad);box-shadow:0 0 0 1px rgba(var(--bad-rgb),.35)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
  .panel + .panel{margin-top:14px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .panel-h .t{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.3px}
  .panel-h .s{font-size:12.5px;color:var(--muted)}

  .preview{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line-2);border-radius:11px;background:var(--field)}
  .preview b{color:var(--text);font-weight:500}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .kpi{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.7}
  .kpi .k{font-size:12px;font-weight:500;color:var(--muted)}
  .kpi .v{font-family:var(--display);font-size:clamp(18px,2vw,25px);white-space:nowrap;font-weight:600;margin-top:4px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:12px;color:var(--muted-2);margin-top:2px}
  .pos{color:var(--good)}
  .neg{color:var(--bad)}
  .mut{color:var(--muted)}

  /* ---------- Liste ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .filters .field{min-width:140px;flex:1}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
  td{padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:rgba(var(--accent-rgb),.06)}
  td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px}
  .dir{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .dir.long{background:rgba(var(--good-rgb),.14);color:var(--good)}
  .dir.short{background:rgba(var(--bad-rgb),.14);color:var(--bad)}
  .tag{display:inline-block;font-size:12px;color:var(--text-2);background:rgba(var(--accent-rgb),.1);border:1px solid rgba(var(--accent-rgb),.22);border-radius:999px;padding:1px 9px}
  .flag{color:var(--warn);font-size:12px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-family:var(--display);font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px}
  .detail td{white-space:normal;background:var(--field);cursor:default;color:var(--text-2);font-size:13.5px}
  .detail:hover{background:none}
  .detail .notes{white-space:pre-wrap;margin:6px 0 10px}

  /* ---------- Stats ---------- */
  .chart{width:100%;height:auto;display:block}
  .bars{display:flex;flex-direction:column;gap:10px}
  .bar{display:grid;grid-template-columns:minmax(90px,160px) 1fr 110px;gap:12px;align-items:center;font-size:13px}
  .bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .nm small{color:var(--muted-2);font-family:var(--mono);font-size:11px;margin-left:6px}
  .bar .tr{height:8px;position:relative;background:var(--field);border-radius:99px;box-shadow:inset 0 0 0 1px var(--line)}
  .bar .tr i{position:absolute;top:0;bottom:0;border-radius:99px}
  .bar .tr .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-2)}
  .bar .val{text-align:right;font-family:var(--mono);font-size:12.5px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .insight{font-size:14px;color:var(--text-2);padding:11px 0 11px 22px;border-bottom:1px solid var(--line);position:relative}
  .insight::before{content:"";position:absolute;left:4px;top:19px;width:7px;height:7px;border-radius:2px;transform:rotate(45deg);background:var(--accent-2)}
  .insight:last-child{border-bottom:0}
  .insight b{color:var(--text)}

  /* ---------- Calendrier ---------- */
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:6px}
  .cal .h{font-size:11.5px;font-weight:500;color:var(--muted);text-align:center;padding-bottom:4px}
  .cell{min-height:80px;border:1px solid var(--line);border-radius:12px;padding:8px 9px;background:var(--field);display:flex;flex-direction:column;justify-content:space-between}
  .cell.out{opacity:.3}
  .cell .dn{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .cell .p{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .cell .n{font-size:10.5px;color:var(--muted)}
  .cell.today{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2)}
  .cell.wk{background:var(--panel-2);border-style:dashed}
  .calnav{display:flex;align-items:center;gap:10px}
  .calnav .m{font-family:var(--display);font-size:16px;font-weight:600;min-width:170px;text-align:center;text-transform:capitalize}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 18px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:calc(100% - 32px);box-shadow:var(--glow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:1020px){
    .shell{grid-template-columns:76px minmax(0,1fr)}
    .topbar{padding:22px 12px;align-items:center}
    .brand{padding:0}
    .brand > span:last-child,.tab span,.sidefoot .priv,.themebtn span{display:none}
    .tab{justify-content:center;padding:11px}
    .wrap{padding:36px 26px 100px}
  }
  @media(max-width:880px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
    .two{grid-template-columns:1fr}
  }
  @media(max-width:620px){
    /* Mobile : la barre latérale devient une barre d'onglets en bas. */
    .shell{display:block}
    .topbar{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:50;flex-direction:row;align-items:center;gap:0;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
    .brand{display:none}
    .tabs{flex-direction:row;flex:1;justify-content:space-around;gap:2px}
    .tab{flex-direction:column;gap:2px;padding:7px 4px;font-size:10px;border-radius:10px;flex:1;box-shadow:none}
    .tab span{display:none}
    .tab::after{content:attr(data-short);white-space:nowrap}
    .tab.active{box-shadow:none;background:var(--panel-2)}
    .tab.cta{margin-top:0}
    .sidefoot{display:none}
    .tab.cta{background:none;color:var(--accent);box-shadow:none}
    .tab.cta svg{stroke:var(--accent)}
    .tab.cta.active{background:rgba(var(--accent-rgb),.12);box-shadow:none}
    .wrap{padding:24px 16px 110px}
    .toast{bottom:84px}
    .g2,.g3,.g4{grid-template-columns:1fr}
    .span2{grid-column:auto}
    .kpi{padding:14px}
    .kpi .v{font-size:19px}
    .bar{grid-template-columns:90px 1fr 84px;gap:8px}
    .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
    .cal .wkh,.cal .wk{display:none}
    .cell{min-height:54px;padding:4px 5px;border-radius:8px}
    .cell .n{display:none}
    .cell .p{font-size:10px}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="topbar">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><polyline points="3 16 9 10 13 14 21 6"/><polyline points="15 6 21 6 21 12"/></svg></span><span><span class="w1">Journal</span><span class="w2">de trading</span></span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sidefoot">
    <button class="themebtn" id="themeBtn" type="button"></button>
    <div class="priv">Tes trades restent dans ce navigateur.</div>
  </div>
</aside>
<main class="wrap" id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================================
   JOURNAL DE TRADING
   Tout reste dans le navigateur (localStorage) : rien n'est envoyé nulle part.
   Un trade se note en prix (entrée, stop, sortie) pour obtenir son résultat
   en R, et en argent (P&L) pour la courbe du compte. Les deux mesures
   répondent à des questions différentes : le R juge la stratégie,
   l'argent juge la gestion du risque.
   ========================================================================= */
'use strict';

var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ if(v===''||v==null) return null; var n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowLocal(){ var d=new Date(); return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ------------------------------------------------------------- Stockage */
var KEY='flux-journal-v1';
var DB={ trades:[], settings:{ capital:10000, currency:'€' } };
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw); if(d && Array.isArray(d.trades)){ DB.trades=d.trades; DB.settings=Object.assign(DB.settings, d.settings||{}); } }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch(e){ toast("Impossible d'enregistrer dans ce navigateur (stockage bloqué ou plein). Exporte tes données."); return false; }
}

var SESSIONS=['Asie','Londres','New York','Hors session'];
var EMOTIONS=['Calme','Confiant','Hésitant','Impatient','Frustré','Euphorique','Peur de rater (FOMO)','Revanche'];
var GRADES=['A+','A','B','C'];

/* Session selon l'heure de Paris (heure saisie = heure locale de l'utilisateur). */
function guessSession(dt){
  var h=parseInt((dt||'').slice(11,13),10); if(isNaN(h)) return '';
  if(h>=1 && h<8) return 'Asie';
  if(h>=8 && h<14) return 'Londres';
  if(h>=14 && h<22) return 'New York';
  return 'Hors session';
}

/* ------------------------------------------------------------- Calculs */
function money(v, sign){
  if(v==null || !isFinite(v)) return '—';
  var s=Math.abs(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
  var c=DB.settings.currency||'€';
  return (v<0?'−':(sign&&v>0?'+':''))+s+' '+c;
}
function rfmt(v){ if(v==null || !isFinite(v)) return '—'; return (v<0?'−':(v>0?'+':''))+Math.abs(v).toFixed(2).replace('.',',')+' R'; }
function pct(v){ return v==null||!isFinite(v)?'—':(v*100).toFixed(1).replace('.',',')+' %'; }
function cls(v){ return v>0?'pos':(v<0?'neg':'mut'); }

/* Dérive R, P&L net et R prévu d'un trade à partir de ce qui a été saisi. */
function derive(t){
  var e=num(t.entry), s=num(t.stop), x=num(t.exit), tp=num(t.target), q=num(t.qty);
  var sign=t.dir==='short'?-1:1;
  var risk=(e!=null && s!=null)?Math.abs(e-s):null;
  var move=(e!=null && x!=null)?(x-e)*sign:null;
  var r=null, rSrc='';
  if(risk && move!=null){ r=move/risk; rSrc='prix'; }
  var pnl=num(t.pnl), pnlCalc=false;
  if(pnl==null && move!=null && q!=null){ pnl=move*q; pnlCalc=true; }
  var fees=num(t.fees)||0;
  var net=pnl!=null?pnl-fees:null;
  var riskMoney=num(t.riskMoney);
  if(r==null && net!=null && riskMoney){ r=net/riskMoney; rSrc='risque'; }
  var planned=(risk && tp!=null)?Math.abs(tp-e)/risk:null;
  return { r:r, rSrc:rSrc, pnl:pnl, pnlCalc:pnlCalc, net:net, planned:planned, risk:risk };
}
function outcome(d){
  var v=d.net!=null?d.net:d.r;
  if(v==null) return 'open';
  if(Math.abs(v)<1e-9) return 'be';
  return v>0?'win':'loss';
}

function sortByDate(a){ return a.slice().sort(function(x,y){ return (x.date||'').localeCompare(y.date||''); }); }

function stats(list){
  var tr=sortByDate(list).map(function(t){ return { t:t, d:derive(t) }; });
  var closed=tr.filter(function(o){ return outcome(o.d)!=='open'; });
  var wins=closed.filter(function(o){ return outcome(o.d)==='win'; });
  var losses=closed.filter(function(o){ return outcome(o.d)==='loss'; });
  function sum(a,f){ return a.reduce(function(s,o){ var v=f(o); return s+(v==null?0:v); },0); }
  var net=sum(closed,function(o){ return o.d.net; });
  var gw=sum(wins,function(o){ return o.d.net; }), gl=-sum(losses,function(o){ return o.d.net; });
  var withR=closed.filter(function(o){ return o.d.r!=null; });
  var sumR=sum(withR,function(o){ return o.d.r; });
  var winsR=withR.filter(function(o){ return o.d.r>0; }), lossR=withR.filter(function(o){ return o.d.r<0; });
  // Courbe du compte et drawdown
  var cap=+DB.settings.capital||0, eq=cap, peak=cap, maxDD=0, maxDDpct=0, curve=[{x:0,y:cap}];
  var streakW=0, streakL=0, bestW=0, worstL=0;
  closed.forEach(function(o,i){
    eq+=o.d.net||0; curve.push({x:i+1,y:eq,t:o.t});
    if(eq>peak) peak=eq;
    var dd=peak-eq; if(dd>maxDD){ maxDD=dd; maxDDpct=peak>0?dd/peak:0; }
    var oc=outcome(o.d);
    if(oc==='win'){ streakW++; streakL=0; } else if(oc==='loss'){ streakL++; streakW=0; } else { streakW=0; streakL=0; }
    bestW=Math.max(bestW,streakW); worstL=Math.max(worstL,streakL);
  });
  var decided=wins.length+losses.length;
  return {
    all:tr, closed:closed, n:closed.length, open:tr.length-closed.length,
    wins:wins.length, losses:losses.length, be:closed.length-decided,
    winRate:decided?wins.length/decided:null,
    net:net, avgWin:wins.length?gw/wins.length:null, avgLoss:losses.length?-gl/losses.length:null,
    pf:gl>0?gw/gl:(gw>0?Infinity:null),
    expectancy:closed.length?net/closed.length:null,
    nR:withR.length, sumR:sumR, expR:withR.length?sumR/withR.length:null,
    avgWinR:winsR.length?sum(winsR,function(o){return o.d.r;})/winsR.length:null,
    avgLossR:lossR.length?sum(lossR,function(o){return o.d.r;})/lossR.length:null,
    maxDD:maxDD, maxDDpct:maxDDpct, curve:curve, equity:eq, bestW:bestW, worstL:worstL,
    fees:sum(closed,function(o){ return num(o.t.fees); })
  };
}

function groupBy(list, keyFn){
  var m={};
  list.forEach(function(t){ var k=keyFn(t); if(k==null||k==='') k='(non renseigné)'; (m[k]=m[k]||[]).push(t); });
  return Object.keys(m).map(function(k){ var s=stats(m[k]); return { k:k, s:s }; })
    .filter(function(g){ return g.s.n>0; })
    .sort(function(a,b){ return b.s.net-a.s.net; });
}

/* ------------------------------------------------------------- UI */
var UI={ tab:'journal', editing:null, form:null, filt:{ q:'', asset:'', setup:'', res:'', from:'', to:'' }, open:null, calMonth:null, statsRange:'all' };
var TABS=[['new','Nouveau trade'],['journal','Journal'],['stats','Statistiques'],['cal','Calendrier'],['settings','Réglages']];

var TAB_IC={
  journal:'<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  new:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>',
  stats:'<path d="M4 20V4"/><path d="M4 20h16"/><polyline points="7 15 11 11 14 13 19 7"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){
    var label=(t[0]==='new' && UI.editing)?'Modifier':t[1];
    return '<button class="tab'+(t[0]==='new'?' cta':'')+(UI.tab===t[0]?' active':'')+'" data-t="'+t[0]+'" data-short="'+(t[0]==='new'?(UI.editing?'Modifier':'Ajouter'):(t[0]==='stats'?'Stats':label))+'" title="'+label+'" aria-label="'+label+'"><svg viewBox="0 0 24 24">'+TAB_IC[t[0]]+'</svg><span>'+label+'</span></button>';
  }).join('');
  $$('#tabs .tab').forEach(function(b){ b.onclick=function(){ go(b.dataset.t); }; });
}
function go(tab){
  if(tab!=='new' && UI.tab==='new' && UI.editing){ UI.editing=null; UI.form=null; }
  UI.tab=tab; renderTabs();
  ({journal:renderJournal,new:renderForm,stats:renderStats,cal:renderCal,settings:renderSettings})[tab]();
  window.scrollTo(0,0);
}
var toastT;
function toast(msg){ var el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('show'); },2600); }

function uniq(field){
  var s={}; DB.trades.forEach(function(t){ if(t[field]) s[t[field]]=1; });
  return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,'fr'); });
}
function demoBanner(){
  return DB.trades.some(function(t){ return t.demo; })
    ? '<div class="callout warn"><b>Trades d\'exemple</b>Le journal contient des trades inventés pour te montrer les statistiques. <button class="btn btn-ghost btn-sm" id="dropDemo" style="margin-top:8px">Supprimer les exemples</button></div>' : '';
}
function bindDemo(after){
  var b=$('#dropDemo'); if(b) b.onclick=function(){ DB.trades=DB.trades.filter(function(t){ return !t.demo; }); save(); toast('Exemples supprimés'); after(); };
}

/* ---------------- Journal ---------------- */
function filtered(){
  var f=UI.filt, q=f.q.trim().toLowerCase();
  return DB.trades.filter(function(t){
    if(f.asset && t.asset!==f.asset) return false;
    if(f.setup && t.setup!==f.setup) return false;
    if(f.from && (t.date||'').slice(0,10)<f.from) return false;
    if(f.to && (t.date||'').slice(0,10)>f.to) return false;
    if(f.res){ var o=outcome(derive(t)); if(o!==f.res) return false; }
    if(q){ var hay=[t.asset,t.setup,t.notes,t.emotion,t.session].join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function renderJournal(){
  var app=$('#app');
  if(!DB.trades.length){
    app.innerHTML='<div class="eyebrow">Journal de trading</div><h1 class="title">Chaque trade noté est une leçon gardée.</h1>'
      +'<p class="lede">Note tes trades — prix, émotion, respect du plan — et le journal te dit ce qui marche vraiment : quel setup, quelle session, quel état d\'esprit.</p>'
      +'<div class="panel empty"><div class="big">Ton journal est vide</div><p style="margin-bottom:18px">Commence par ton dernier trade, ou charge des exemples pour voir ce que donnent les statistiques.</p>'
      +'<div class="row" style="justify-content:center"><button class="btn btn-primary" id="first">Noter un trade</button><button class="btn btn-ghost" id="demo">Charger des exemples</button></div></div>'
      +'<div class="callout"><b>Confidentialité</b>Tout reste dans ce navigateur. Rien n\'est envoyé sur un serveur — pense à exporter une sauvegarde de temps en temps (onglet Réglages).</div>';
    $('#first').onclick=function(){ go('new'); };
    $('#demo').onclick=function(){ loadDemo(); go('journal'); };
    return;
  }
  var list=sortByDate(filtered()).reverse();
  var s=stats(list);
  var f=UI.filt;
  var opt=function(arr,sel){ return '<option value="">Tous</option>'+arr.map(function(v){ return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'; }).join(''); };
  var html='<div class="eyebrow">Journal de trading</div><h1 class="title">Tes trades</h1>'+demoBanner()
    +kpiRow(s)
    +'<div class="filters">'
    +'<div class="field" style="flex:2;min-width:180px"><label for="fq">Rechercher</label><input id="fq" type="search" placeholder="Actif, setup, note…" value="'+esc(f.q)+'"></div>'
    +'<div class="field"><label for="fa">Actif</label><select id="fa">'+opt(uniq('asset'),f.asset)+'</select></div>'
    +'<div class="field"><label for="fs">Setup</label><select id="fs">'+opt(uniq('setup'),f.setup)+'</select></div>'
    +'<div class="field"><label for="fr">Résultat</label><select id="fr"><option value="">Tous</option>'
      +[['win','Gagnants'],['loss','Perdants'],['be','Breakeven'],['open','Ouverts']].map(function(o){ return '<option value="'+o[0]+'"'+(f.res===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></div>'
    +'<div class="field"><label for="ff">Du</label><input id="ff" type="date" value="'+esc(f.from)+'"></div>'
    +'<div class="field"><label for="ft">Au</label><input id="ft" type="date" value="'+esc(f.to)+'"></div>'
    +'</div>';
  if(!list.length){
    html+='<div class="panel empty"><div class="big">Aucun trade ne correspond</div><button class="btn btn-ghost btn-sm" id="clr">Effacer les filtres</button></div>';
  }else{
    html+='<div class="tablewrap"><table><thead><tr><th>Date</th><th>Actif</th><th>Sens</th><th>Setup</th><th>Session</th><th class="num">Entrée</th><th class="num">Sortie</th><th class="num">R</th><th class="num">P&amp;L net</th><th>Plan</th></tr></thead><tbody>';
    list.forEach(function(t){
      var d=derive(t), oc=outcome(d);
      html+='<tr data-id="'+t.id+'"><td>'+esc(fmtDate(t.date))+'</td><td><b>'+esc(t.asset||'—')+'</b></td>'
        +'<td><span class="dir '+t.dir+'">'+(t.dir==='short'?'Short':'Long')+'</span></td>'
        +'<td>'+(t.setup?'<span class="tag">'+esc(t.setup)+'</span>':'<span class="mut">—</span>')+'</td>'
        +'<td class="mut">'+esc(t.session||'—')+'</td>'
        +'<td class="num">'+esc(t.entry||'—')+'</td><td class="num">'+(oc==='open'?'<span class="mut">ouvert</span>':esc(t.exit||'—'))+'</td>'
        +'<td class="num '+cls(d.r)+'">'+rfmt(d.r)+'</td><td class="num '+cls(d.net)+'">'+money(d.net,true)+'</td>'
        +'<td>'+(t.plan===false?'<span class="flag" title="Plan non respecté">✕ hors plan</span>':(t.plan===true?'<span class="mut">✓</span>':''))+'</td></tr>';
      if(UI.open===t.id) html+=detailRow(t,d);
    });
    html+='</tbody></table></div>';
  }
  app.innerHTML=html;
  bindDemo(renderJournal);
  var bind=function(id,key,ev){ var el=$(id); el.addEventListener(ev||'change',function(){ UI.filt[key]=el.value; renderJournal(); if(ev==='input'){ var n=$(id); n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }); };
  bind('#fq','q','input'); bind('#fa','asset'); bind('#fs','setup'); bind('#fr','res'); bind('#ff','from'); bind('#ft','to');
  var clr=$('#clr'); if(clr) clr.onclick=function(){ UI.filt={ q:'', asset:'', setup:'', res:'', from:'', to:'' }; renderJournal(); };
  $$('tbody tr[data-id]').forEach(function(tr){ tr.onclick=function(){ UI.open=UI.open===tr.dataset.id?null:tr.dataset.id; renderJournal(); }; });
  var ed=$('#edit'); if(ed) ed.onclick=function(e){ e.stopPropagation(); UI.editing=UI.open; UI.form=null; go('new'); };
  var dup=$('#dup'); if(dup) dup.onclick=function(e){ e.stopPropagation(); var src=findTrade(UI.open); UI.editing=null; UI.form=Object.assign({},src,{id:null,date:nowLocal(),exit:'',pnl:'',fees:'',notes:'',demo:false}); go('new'); };
  var del=$('#del'); if(del) del.onclick=function(e){ e.stopPropagation(); if(!confirm('Supprimer ce trade ?')) return; DB.trades=DB.trades.filter(function(t){ return t.id!==UI.open; }); UI.open=null; save(); toast('Trade supprimé'); renderJournal(); };
}
function findTrade(id){ for(var i=0;i<DB.trades.length;i++) if(DB.trades[i].id===id) return DB.trades[i]; return null; }
function fmtDate(dt){
  if(!dt) return '—';
  var d=new Date(dt); if(isNaN(d)) return dt;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'})+(dt.length>10?' · '+dt.slice(11,16):'');
}
function detailRow(t,d){
  var bits=[];
  if(t.stop) bits.push('Stop <b>'+esc(t.stop)+'</b>');
  if(t.target) bits.push('Objectif <b>'+esc(t.target)+'</b>');
  if(d.planned!=null) bits.push('R:R prévu <b>'+d.planned.toFixed(2)+'</b>');
  if(t.qty) bits.push('Taille <b>'+esc(t.qty)+'</b>');
  if(num(t.fees)) bits.push('Frais <b>'+money(num(t.fees))+'</b>');
  if(d.pnl!=null) bits.push('P&amp;L brut <b>'+money(d.pnl,true)+'</b>'+(d.pnlCalc?' <span class="mut">(calculé : écart × taille)</span>':''));
  if(d.rSrc==='risque') bits.push('<span class="mut">R calculé depuis le risque en argent</span>');
  if(t.grade) bits.push('Qualité <b>'+esc(t.grade)+'</b>');
  if(t.emotion) bits.push('Émotion <b>'+esc(t.emotion)+'</b>');
  var link=t.link && /^https?:\/\//i.test(t.link)?'<a href="'+esc(t.link)+'" target="_blank" rel="noopener noreferrer">Voir la capture ↗</a>':'';
  return '<tr class="detail"><td colspan="10"><div class="preview" style="border:0;padding:0 0 8px">'+bits.join('<span class="mut">·</span>')+'</div>'
    +(t.notes?'<div class="notes">'+esc(t.notes)+'</div>':'')
    +(t.lesson?'<div class="notes"><b style="color:var(--accent)">Leçon :</b> '+esc(t.lesson)+'</div>':'')
    +'<div class="row">'+link+'<span style="flex:1"></span><button class="btn btn-ghost btn-sm" id="dup">Dupliquer</button><button class="btn btn-ghost btn-sm" id="edit">Modifier</button><button class="btn btn-danger btn-sm" id="del">Supprimer</button></div></td></tr>';
}
function kpiRow(s){
  return '<div class="kpis">'
    +'<div class="kpi"><div class="k">P&amp;L net</div><div class="v '+cls(s.net)+'">'+money(s.net,true)+'</div><div class="d">'+s.n+' trade'+(s.n>1?'s':'')+' clôturé'+(s.n>1?'s':'')+(s.open?' · '+s.open+' ouvert'+(s.open>1?'s':''):'')+'</div></div>'
    +'<div class="kpi"><div class="k">Taux de réussite</div><div class="v">'+pct(s.winRate)+'</div><div class="d">'+s.wins+' gagnant'+(s.wins>1?'s':'')+' · '+s.losses+' perdant'+(s.losses>1?'s':'')+(s.be?' · '+s.be+' BE':'')+'</div></div>'
    +'<div class="kpi"><div class="k">Espérance</div><div class="v '+cls(s.expR)+'">'+rfmt(s.expR)+'</div><div class="d">par trade · '+money(s.expectancy,true)+'</div></div>'
    +'<div class="kpi"><div class="k">Profit factor</div><div class="v">'+(s.pf==null?'—':(s.pf===Infinity?'∞':s.pf.toFixed(2).replace('.',',')))+'</div><div class="d">gains ÷ pertes</div></div>'
    +'</div>';
}

/* ---------------- Formulaire ---------------- */
function blank(){
  var last=sortByDate(DB.trades).slice(-1)[0]||{};
  var dt=nowLocal();
  return { id:null, date:dt, asset:last.asset||'', dir:'long', setup:'', session:guessSession(dt), entry:'', stop:'', target:'', exit:'', qty:'', riskMoney:'', pnl:'', fees:'', grade:'', emotion:'', plan:null, notes:'', lesson:'', link:'' };
}
function renderForm(){
  if(!UI.form){ UI.form=UI.editing?Object.assign(blank(),findTrade(UI.editing)):blank(); }
  var t=UI.form;
  var dl=function(id,arr){ return '<datalist id="'+id+'">'+arr.map(function(v){ return '<option value="'+esc(v)+'">'; }).join('')+'</datalist>'; };
  var sel=function(id,arr,val){ return '<select id="'+id+'"><option value="">—</option>'+arr.map(function(v){ return '<option'+(v===val?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+'</select>'; };
  var inp=function(id,label,val,extra,hint){ return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" value="'+esc(val)+'" '+(extra||'')+'>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'; };
  var numAttr='inputmode="decimal" autocomplete="off"';
  $('#app').innerHTML='<div class="eyebrow">'+(UI.editing?'Modifier':'Nouveau trade')+'</div><h1 class="title">'+(UI.editing?'Corrige ton trade':'Note ton trade')+'</h1>'

function preview(){
  var t=UI.form, d=derive(t), bits=[], warn='';
  var e=num(t.entry), s=num(t.stop), tp=num(t.target);
  if(e!=null && s!=null){
    if((t.dir==='long' && s>=e) || (t.dir==='short' && s<=e)) warn='Le stop est du mauvais côté de l\'entrée pour un '+(t.dir==='short'?'short':'long')+'.';
  }
  if(!warn && e!=null && tp!=null && ((t.dir==='long' && tp<=e) || (t.dir==='short' && tp>=e))) warn='L\'objectif est du mauvais côté de l\'entrée.';
  if(d.planned!=null) bits.push('R:R prévu <b>'+d.planned.toFixed(2)+'</b>');
  bits.push('Résultat <b class="'+cls(d.r)+'">'+rfmt(d.r)+'</b>');
  bits.push('P&amp;L net <b class="'+cls(d.net)+'">'+money(d.net,true)+'</b>');
  if(outcome(d)==='open') bits.push('<span>Trade ouvert</span>');
  $('#pv').innerHTML=bits.join('')+(warn?'<span style="color:var(--warn)">⚠ '+warn+'</span>':'');
}
function submit(){
  var t=UI.form, bad=[];
  if(!t.date) bad.push('f_date');
  if(!String(t.asset||'').trim()) bad.push('f_asset');
  ['f_entry','f_stop','f_target','f_exit','f_pnl','f_fees','f_qty','f_risk'].forEach(function(id){ var v=$('#'+id).value.trim(); if(v!=='' && num(v)==null) bad.push(id); });
  if(t.link && !/^https?:\/\//i.test(t.link)) bad.push('f_link');
  if(bad.length){ bad.forEach(function(id){ $('#'+id).classList.add('bad'); }); $('#'+bad[0]).focus(); toast('Vérifie les champs en rouge'); return; }
  t.asset=String(t.asset).trim().toUpperCase(); t.setup=String(t.setup||'').trim();
  var rec=Object.assign({},t);
  if(UI.editing){
    rec.id=UI.editing; delete rec.demo;
    DB.trades=DB.trades.map(function(x){ return x.id===UI.editing?Object.assign(rec,{demo:x.demo}):x; });
  }else{
    rec.id=uid(); rec.demo=false; DB.trades.push(rec);
  }
  save();
  toast(UI.editing?'Trade modifié':'Trade ajouté au journal');
  UI.open=rec.id; UI.editing=null; UI.form=null; go('journal');
}

function rangeFilter(list){
  if(UI.statsRange==='all') return list;
  var d=new Date(), from;
  if(UI.statsRange==='30') from=new Date(d.getTime()-30*864e5);
  else if(UI.statsRange==='90') from=new Date(d.getTime()-90*864e5);
  else if(UI.statsRange==='ytd') from=new Date(d.getFullYear(),0,1);
  var f=ymd(from);
  return list.filter(function(t){ return (t.date||'').slice(0,10)>=f; });
}

  if(!s.n){

    +'<div class="kpi"><div class="k">Perte moyenne</div><div class="v neg">'+money(s.avgLoss,true)+'</div><div class="d">'+rfmt(s.avgLossR)+'</div></div>'
    +'<div class="kpi"><div class="k">Drawdown max</div><div class="v neg">'+(s.maxDD?money(-s.maxDD):'—')+'</div><div class="d">'+(s.maxDD?pct(s.maxDDpct)+' du pic':'aucun')+'</div></div>'
    +'<div class="kpi"><div class="k">Séries</div><div class="v">'+s.bestW+' <span class="mut" style="font-size:14px">/</span> '+s.worstL+'</div><div class="d">gains · pertes consécutifs max</div></div>'
    +'</div>'
    +'<div class="panel"><div class="panel-h"><span class="t">Courbe du compte</span><span class="s">Capital de départ '+money(+DB.settings.capital)+' → <b class="'+cls(s.equity-DB.settings.capital)+'">'+money(s.equity)+'</b>'+(s.fees?' · frais payés '+money(s.fees):'')+'</span></div>'+equitySvg(s.curve)+'</div>'

function equitySvg(c){
  var W=900,H=260,P={l:64,r:14,t:14,b:26};
  var ys=c.map(function(p){ return p.y; }), min=Math.min.apply(null,ys), max=Math.max.apply(null,ys);
  if(max-min<1e-9){ max+=1; min-=1; }
  var pad=(max-min)*.08; min-=pad; max+=pad;
  var n=Math.max(1,c.length-1);
  var X=function(i){ return P.l+(W-P.l-P.r)*i/n; }, Y=function(v){ return P.t+(H-P.t-P.b)*(1-(v-min)/(max-min)); };
  var pts=c.map(function(p,i){ return X(i).toFixed(1)+','+Y(p.y).toFixed(1); }).join(' ');
  var base=Y(c[0].y);
  var up=c[c.length-1].y>=c[0].y, col=up?'var(--good)':'var(--bad)';
  var grid='', ticks=4;
  for(var k=0;k<=ticks;k++){
    var v=min+(max-min)*k/ticks, y=Y(v);
    grid+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'
      +'<text x="'+(P.l-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" style="fill:var(--muted-2)" font-size="11" font-family="JetBrains Mono,monospace">'+Math.round(v).toLocaleString('fr-FR')+'</text>';
  }
  var dots=c.length<=80?c.slice(1).map(function(p,i){ var d=derive(p.t); return '<circle cx="'+X(i+1).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5" style="fill:'+((d.net||0)>=0?'var(--good)':'var(--bad)')+';stroke:var(--panel);stroke-width:1.5"><title>'+esc(p.t.asset)+' · '+esc(fmtDate(p.t.date))+' · '+money(d.net,true)+'</title></circle>'; }).join(''):'';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution du capital, trade après trade">'
    +grid
    +'<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+base.toFixed(1)+'" y2="'+base.toFixed(1)+'" style="stroke:var(--muted-2)" stroke-dasharray="4 4"/>'
    +'<defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+col+';stop-opacity:.28"/><stop offset="1" style="stop-color:'+col+';stop-opacity:0"/></linearGradient></defs>'
    +'<polygon points="'+X(0).toFixed(1)+','+base.toFixed(1)+' '+pts+' '+X(c.length-1).toFixed(1)+','+base.toFixed(1)+'" fill="url(#eqg)"/>'
    +'<polyline points="'+pts+'" fill="none" style="stroke:'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots
    +'<text x="'+P.l+'" y="'+(H-6)+'" style="fill:var(--muted-2)" font-size="11" font-family="JetBrains Mono,monospace">trade 1</text>'
    +'<text x="'+(W-P.r)+'" y="'+(H-6)+'" text-anchor="end" style="fill:var(--muted-2)" font-size="11" font-family="JetBrains Mono,monospace">trade '+(c.length-1)+'</text>'
    +'</svg>';
}
function breakdown(title,groups){
  var body;
  if(!groups.length || (groups.length===1 && groups[0].k==='(non renseigné)')){
    body='<p class="mut" style="font-size:13.5px">Pas encore renseigné sur tes trades.</p>';
  }else{
    var m=Math.max.apply(null,groups.map(function(g){ return Math.abs(g.s.net); }))||1;
    body='<div class="bars">'+groups.map(function(g){
      var w=Math.abs(g.s.net)/m*50, pos=g.s.net>=0;
      return '<div class="bar"><span class="nm" title="'+esc(g.k)+'">'+esc(g.k)+'<small>'+g.s.n+'</small></span>'
        +'<span class="tr"><span class="mid"></span><i style="'+(pos?'left:50%':'right:50%')+';width:'+w.toFixed(1)+'%;background:'+(pos?'var(--good)':'var(--bad)')+'"></i></span>'
        +'<span class="val '+cls(g.s.net)+'">'+money(g.s.net,true)+'<br><span class="mut" style="font-size:11px">'+pct(g.s.winRate)+' · '+rfmt(g.s.expR)+'</span></span></div>';
    }).join('')+'</div>';
  }
  return '<div class="panel" style="margin:0"><div class="panel-h"><span class="t">'+title+'</span><span class="s">P&amp;L · réussite · espérance</span></div>'+body+'</div>';
}
function insights(list,s){
  var out=[];
  if(s.n<20) out.push('Avec <b>'+s.n+' trade'+(s.n>1?'s':'')+'</b>, les chiffres ci-dessous bougent encore beaucoup. Il en faut une trentaine par setup avant de conclure qu\'il marche ou non.');
  if(s.winRate!=null && s.avgWinR!=null && s.avgLossR!=null){
    var be=Math.abs(s.avgLossR)/(s.avgWinR+Math.abs(s.avgLossR));
    out.push('Avec tes gains et pertes moyens en R, il te faut <b>'+pct(be)+'</b> de réussite pour être à l\'équilibre. Tu es à <b class="'+(s.winRate>=be?'pos':'neg')+'">'+pct(s.winRate)+'</b>.');
  }
  var plan=groupBy(list,function(t){ return t.plan===true?'Oui':(t.plan===false?'Non':null); });
  var yes=plan.filter(function(g){ return g.k==='Oui'; })[0], no=plan.filter(function(g){ return g.k==='Non'; })[0];
  if(no) out.push('Hors plan : <b>'+no.s.n+' trade'+(no.s.n>1?'s':'')+'</b> pour <b class="'+cls(no.s.net)+'">'+money(no.s.net,true)+'</b>'+(yes?', contre <b class="'+cls(yes.s.expR)+'">'+rfmt(yes.s.expR)+'</b> par trade quand tu suis ton plan (<b class="'+cls(no.s.expR)+'">'+rfmt(no.s.expR)+'</b> sinon).':'.'));
  var setups=groupBy(list,function(t){ return t.setup; }).filter(function(g){ return g.k!=='(non renseigné)' && g.s.n>=3; });
  if(setups.length>=2){
    var best=setups[0], worst=setups[setups.length-1];
    if(worst.s.net<0) out.push('Meilleur setup : <b>'+esc(best.k)+'</b> ('+money(best.s.net,true)+'). Celui qui te coûte : <b>'+esc(worst.k)+'</b> ('+money(worst.s.net,true)+' sur '+worst.s.n+' trades).');
  }
  var emo=groupBy(list,function(t){ return t.emotion; }).filter(function(g){ return g.k!=='(non renseigné)' && g.s.n>=2 && g.s.net<0; });
  if(emo.length){ var w=emo[emo.length-1]; out.push('Quand tu es <b>'+esc(w.k.toLowerCase())+'</b>, tu perds en moyenne <b class="neg">'+money(w.s.expectancy)+'</b> par trade.'); }
  var over=s.closed.filter(function(o){ return o.d.r!=null && o.d.r<-1.1; });
  if(over.length) out.push('<b>'+over.length+' trade'+(over.length>1?'s':'')+'</b> ont perdu plus que le risque prévu (au-delà de −1 R) : stop déplacé, slippage, ou pas de stop.');
  if(!out.length) out.push('Continue à noter tes trades — les enseignements apparaissent avec le volume.');
  return out.map(function(t){ return '<div class="insight">'+t+'</div>'; }).join('');
}

/* ---------------- Calendrier ---------------- */
function renderCal(){
  if(!UI.calMonth){
    var last=sortByDate(DB.trades).slice(-1)[0];
    var d=last&&last.date?new Date(last.date):new Date(); if(isNaN(d)) d=new Date();
    UI.calMonth=new Date(d.getFullYear(),d.getMonth(),1);
  }
  var m=UI.calMonth, y=m.getFullYear(), mo=m.getMonth();
  var byDay={};
  DB.trades.forEach(function(t){
    var d=derive(t); if(outcome(d)==='open') return;
    var k=(t.date||'').slice(0,10); byDay[k]=byDay[k]||{p:0,n:0}; byDay[k].p+=d.net||0; byDay[k].n++;
  });
  var monthKey=y+'-'+pad(mo+1), monthTot=0, monthN=0, greenDays=0, redDays=0;
  Object.keys(byDay).forEach(function(k){ if(k.slice(0,7)===monthKey){ monthTot+=byDay[k].p; monthN+=byDay[k].n; if(byDay[k].p>0) greenDays++; else if(byDay[k].p<0) redDays++; } });
  var maxAbs=0; Object.keys(byDay).forEach(function(k){ if(k.slice(0,7)===monthKey) maxAbs=Math.max(maxAbs,Math.abs(byDay[k].p)); });
  var start=new Date(y,mo,1), off=(start.getDay()+6)%7, cur=new Date(y,mo,1-off), today=ymd(new Date());
  var html='<div class="eyebrow">Calendrier</div><h1 class="title">Jour par jour</h1>'
    +'<div class="panel"><div class="panel-h"><div class="calnav"><button class="btn btn-ghost btn-sm" id="pm" aria-label="Mois précédent">←</button><span class="m">'+m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</span><button class="btn btn-ghost btn-sm" id="nm" aria-label="Mois suivant">→</button></div>'
    +'<span class="s">'+monthN+' trade'+(monthN>1?'s':'')+' · <b class="'+cls(monthTot)+'">'+money(monthTot,true)+'</b> · '+greenDays+' jour'+(greenDays>1?'s':'')+' vert'+(greenDays>1?'s':'')+', '+redDays+' rouge'+(redDays>1?'s':'')+'</span></div>'
    +'<div class="cal">'+['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(function(d){ return '<div class="h">'+d+'</div>'; }).join('')+'<div class="h wkh">Semaine</div>';
  for(var w=0;w<6;w++){
    var wk=0, wn=0;
    for(var i=0;i<7;i++){
      var k=ymd(cur), v=byDay[k], inM=cur.getMonth()===mo;
      var bg='';
      if(v && inM && maxAbs>0){ var a=(.12+.45*Math.abs(v.p)/maxAbs).toFixed(2); bg='background:rgba('+(v.p>=0?'var(--good-rgb)':'var(--bad-rgb)')+','+a+')'; }
      if(v && inM){ wk+=v.p; wn+=v.n; }
      html+='<div class="cell'+(inM?'':' out')+(k===today?' today':'')+'" style="'+bg+'"><span class="dn">'+cur.getDate()+'</span>'
        +(v&&inM?'<span><div class="p '+(v.p>0?'pos':(v.p<0?'neg':'mut'))+'" style="color:var(--text)">'+money(v.p,true).replace(/,\d\d /,' ')+'</div><div class="n">'+v.n+' trade'+(v.n>1?'s':'')+'</div></span>':'')+'</div>';
      cur.setDate(cur.getDate()+1);
    }
    html+='<div class="cell wk"><span class="dn">S'+(w+1)+'</span>'+(wn?'<span><div class="p '+cls(wk)+'">'+money(wk,true).replace(/,\d\d /,' ')+'</div><div class="n">'+wn+' trade'+(wn>1?'s':'')+'</div></span>':'')+'</div>';
    if(cur.getMonth()!==mo && w>=3) break;
  }
  html+='</div></div>';
  $('#app').innerHTML=html;
  $('#pm').onclick=function(){ UI.calMonth=new Date(y,mo-1,1); renderCal(); };
  $('#nm').onclick=function(){ UI.calMonth=new Date(y,mo+1,1); renderCal(); };
}

  $('#app').innerHTML='<div class="eyebrow">Réglages</div><h1 class="title">Compte et sauvegarde</h1>'
    +'<div class="panel"><div class="panel-h"><span class="t">Compte</span></div><div class="grid g3">'
    +'<div class="field"><label for="s_cap">Capital de départ</label><input id="s_cap" inputmode="decimal" value="'+esc(st.capital)+'"><span class="hint">Point de départ de la courbe et du drawdown.</span></div>'
    +'<div class="field"><label>Apparence</label><div class="seg" id="s_theme"><button type="button" data-v="dark"'+(currentTheme()==='dark'?' class="on"':'')+'>Sombre</button><button type="button" data-v="light"'+(currentTheme()==='light'?' class="on"':'')+'>Clair</button></div></div>'
    +'<div class="field"><label for="s_cur">Devise</label><select id="s_cur">'+['€','$','£','CHF'].map(function(c){ return '<option'+(c===st.currency?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></div>'
    +'</div></div>'
    +'<div class="panel"><div class="panel-h"><span class="t">Sauvegarde</span><span class="s">'+DB.trades.length+' trade'+(DB.trades.length>1?'s':'')+' dans ce navigateur</span></div>'
    +'<p style="font-size:14px;color:var(--text-2);margin-bottom:14px">Le journal vit dans ce navigateur uniquement. Vider les données du site, changer de navigateur ou d\'appareil le fait disparaître : exporte une sauvegarde régulièrement.</p>'
    +'<div class="row"><button class="btn btn-primary btn-sm" id="exJson">Exporter la sauvegarde (.json)</button><button class="btn btn-ghost btn-sm" id="exCsv">Exporter pour Excel (.csv)</button><button class="btn btn-ghost btn-sm" id="imBtn">Importer une sauvegarde</button><input type="file" id="imFile" accept=".json,application/json" hidden></div></div>'
    +'<div class="panel"><div class="panel-h"><span class="t">Zone dangereuse</span></div><button class="btn btn-danger btn-sm" id="wipe">Effacer tout le journal</button></div>';
  $('#s_cap').onchange=function(){ var v=num(this.value); if(v==null||v<0){ this.classList.add('bad'); return; } this.classList.remove('bad'); st.capital=v; save(); toast('Capital enregistré'); };
  $$('#s_theme button').forEach(function(b){ b.onclick=function(){ setTheme(b.dataset.v); renderSettings(); }; });
  $('#s_cur').onchange=function(){ st.currency=this.value; save(); toast('Devise enregistrée'); };
  $('#exJson').onclick=function(){ download('journal-trading-'+ymd(new Date())+'.json', JSON.stringify(DB,null,2), 'application/json'); };
  $('#exCsv').onclick=function(){ download('journal-trading-'+ymd(new Date())+'.csv', '﻿'+toCsv(), 'text/csv;charset=utf-8'); };
  $('#imBtn').onclick=function(){ $('#imFile').click(); };
  $('#imFile').onchange=function(){
    var f=this.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        var arr=Array.isArray(d)?d:d.trades;
        if(!Array.isArray(arr)) throw 0;
        arr=arr.filter(function(t){ return t && typeof t==='object' && t.date; }).map(function(t){ return Object.assign(blank(),t,{id:t.id||uid()}); });
        var ids={}; DB.trades.forEach(function(t){ ids[t.id]=1; });
        var fresh=arr.filter(function(t){ return !ids[t.id]; });
        DB.trades=DB.trades.concat(fresh);
        if(d.settings && !Array.isArray(d)) DB.settings=Object.assign(DB.settings,d.settings);
        save(); toast(fresh.length+' trade'+(fresh.length>1?'s':'')+' importé'+(fresh.length>1?'s':'')+(arr.length-fresh.length?' ('+(arr.length-fresh.length)+' déjà présents)':''));
        renderSettings();
      }catch(e){ toast('Ce fichier n\'est pas une sauvegarde du journal'); }
    };
    r.readAsText(f);
  };
  $('#wipe').onclick=function(){ if(!confirm('Effacer définitivement les '+DB.trades.length+' trades ? Exporte une sauvegarde avant si tu veux les garder.')) return; DB.trades=[]; save(); toast('Journal effacé'); renderSettings(); };
}
function download(name,content,type){
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function toCsv(){
  var cols=[['Date','date'],['Actif','asset'],['Sens','dir'],['Setup','setup'],['Session','session'],['Qualité','grade'],['Entrée','entry'],['Stop','stop'],['Objectif','target'],['Sortie','exit'],['Taille','qty'],['P&L brut','pnl'],['Frais','fees'],['Émotion','emotion'],['Plan respecté','plan'],['Notes','notes'],['Leçon','lesson'],['Capture','link']];
  var q=function(v){ v=v==null?'':String(v); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var dec=function(v){ return v==null?'':String(Math.round(v*100)/100).replace('.',','); };
  var lines=[cols.map(function(c){ return c[0]; }).concat(['R','P&L net']).join(';')];
  sortByDate(DB.trades).forEach(function(t){
    var d=derive(t);
    lines.push(cols.map(function(c){
      var v=t[c[1]];
      if(c[1]==='plan') v=v===true?'oui':(v===false?'non':'');
      else if(c[1]==='dir') v=v==='short'?'Short':'Long';
      else if(/^(entry|stop|target|exit|qty|pnl|fees)$/.test(c[1]) && v!=='' && v!=null) v=String(v).replace('.',',');
      return q(v);
    }).concat([dec(d.r),dec(d.net)]).join(';'));
  });
  return lines.join('\r\n');
}

/* ---------------- Exemples ---------------- */
function loadDemo(){
  // Générateur déterministe : mêmes exemples à chaque chargement.
  var seed=7; var rnd=function(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  var assets=[['EURUSD',1.085,.0015,100000],['NQ',18200,25,20],['XAUUSD',2350,6,100],['BTCUSD',64000,600,0.5]];
  var setups=['Sweep + ChoCh','OB retest','FVG continuation','Breakout'];
  var edge={'Sweep + ChoCh':.58,'OB retest':.5,'FVG continuation':.45,'Breakout':.33};
  var out=[], d=new Date(), today=ymd(new Date()); d.setDate(d.getDate()-60);
  for(var i=0;i<34;i++){
    d.setDate(d.getDate()+1+(rnd()<.35?1:0));
    if(d.getDay()===0) d.setDate(d.getDate()+1);
    if(d.getDay()===6) d.setDate(d.getDate()+2);
    if(ymd(d)>=today) break;
    var a=assets[Math.floor(rnd()*assets.length)], st=setups[Math.floor(rnd()*setups.length)];
    var dir=rnd()<.55?'long':'short', sg=dir==='long'?1:-1;
    var h=[9,10,15,16,15,3][Math.floor(rnd()*6)];
    var dt=ymd(d)+'T'+pad(h)+':'+pad(Math.floor(rnd()*4)*15);
    var plan=rnd()<.78, emo=plan?['Calme','Confiant','Calme','Hésitant'][Math.floor(rnd()*4)]:['Impatient','Peur de rater (FOMO)','Revanche','Frustré'][Math.floor(rnd()*4)];
    var p=edge[st]-(plan?0:.2);
    var entry=a[1]*(1+(rnd()-.5)*.04), risk=a[2]*(.7+rnd()*.6), rr=[1.5,2,2,2.5,3][Math.floor(rnd()*5)];
    var r=rnd()<p?rr*(rnd()<.8?1:.5):(rnd()<.12?0:(plan?-1:-(1+rnd()*.8)));
    var dp=a[1]<10?5:(a[1]<5000?2:0), f=function(v){ return v.toFixed(dp); };
    var qty=Math.round(100/(risk*a[3])*a[3]*100)/100;
    out.push({ id:uid(), demo:true, date:dt, asset:a[0], dir:dir, setup:st, session:guessSession(dt), grade:plan?(rnd()<.4?'A+':'A'):(rnd()<.5?'B':'C'),
      entry:f(entry), stop:f(entry-sg*risk), target:f(entry+sg*risk*rr), exit:f(entry+sg*risk*r), qty:'', riskMoney:'100',
      pnl:String(Math.round(r*100*100)/100), fees:String((2+rnd()*4).toFixed(2)), emotion:emo, plan:plan,
      notes:'Trade d\'exemple (inventé).', lesson:'', link:'' });
  }
  DB.trades=DB.trades.concat(out); save();
  toast(out.length+' trades d\'exemple chargés');
}

/* ---------------- Thème ---------------- */
var THEME_KEY='flux-journal-theme';
function currentTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t) return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}
function paintThemeBtn(){
  var light=currentTheme()==='light';
  $('#themeBtn').innerHTML=light
    ?'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Mode sombre</span>'
    :'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Mode clair</span>';
  $('#themeBtn').setAttribute('aria-label',light?'Passer en mode sombre':'Passer en mode clair');
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
  paintThemeBtn();
}
(function(){
  try{ var t=localStorage.getItem(THEME_KEY); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
  paintThemeBtn();
  $('#themeBtn').onclick=function(){
    setTheme(currentTheme()==='light'?'dark':'light');
    if(UI.tab==='settings') renderSettings();
  };
})();

load();
go('journal');
</script>
